name: RaedStudent
options:
  bundleIdPrefix: sa.raed
  deploymentTarget:
    iOS: "14.3"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.10
    DEVELOPMENT_TEAM: ""
    PRODUCT_NAME: "طلاب AEC"
targets:
  RaedStudent:
    type: application
    platform: iOS
    sources:
      - path: RaedStudent
    resources:
      - path: RaedStudent/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: sa.raed.masari
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 2.0.0
        CURRENT_PROJECT_VERSION: 4
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "طلاب AEC"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_NSCameraUsageDescription: "يحتاج طلاب AEC إلى الكاميرا لتصوير شرح المحاضرة وإرفاقه بالمقرر."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "يحتاج طلاب AEC إلى الصور لإرفاق صور الشرح بالمقرر أو المحادثة."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "يحتاج طلاب AEC إلى الميكروفون لتسجيل شرح المحاضرة."
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme:
      testTargets: []
